name: Production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed Vercel URL, for example https://tarot-daily-78-history.vercel.app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base_url }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate smoke credentials
        run: |
          test -n "$E2E_TEST_USERNAME"
          test -n "$E2E_TEST_PASSWORD"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run member smoke test
        run: npx playwright test tests/e2e/member-ai.spec.mjs --project=desktop-chromium
